<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            margin-top: 20px;
        }
        img:hover{
            transform: scale(1.1);
            transition: 0.1s;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 50vh;
        }
        .container-1{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh;
        }
        .container-1-2{
            display: flex;
        }
        .container-1-3{
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        #like-btn {
        padding: 8px 15px;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
    }

       #like-btn img {
       width: 24px;
       height: 24px;
       margin-top: 0; 
    }
    </style>
</head>
<body>
    <div class="container">
        <button id="bosildi-btn">Tugma</button>
        <img src="images.png" alt="Sharingan eyes">
    </div> 
    
    <div class="container-1">
        <input id="ParoL" type="password" placeholder="Parolni kiriting...">
        <label><input id="checkBox" type="checkbox">Parolni korsatish</label>
    </div>
    
    <div class="container-1-2">
        <input id="inpt-Text" type="text">
        <button id="qoshish-btn">Qo'shish</button>
    </div>
    
    <form class="container-1-3">
        <input id="ism-inp" type="text" placeholder="Ismingizni kiriting">
        <input id="yosh-inp" type="number" placeholder="Yoshingizni kiriting">
        <button id="Yuborish-btn" type="submit">Yuborish</button>
        <p id="natija"></p>
    </form>

       <button id="like-btn">
       <img id="like-img" src="like-icon1.png" alt="Like"> <span id="like-count">0</span>
       </button>

    <script>
        const Button = document.getElementById("bosildi-btn");
        Button.onclick = function(){
            if(Button.textContent == "Tugma"){
                Button.textContent = "Bosildi";
            }else{
                Button.textContent = "Tugma";
            }
        }

        const Parol = document.getElementById("ParoL");
        const CheckBox = document.getElementById("checkBox");

        CheckBox.addEventListener('change', function(){
            if(Parol.type == "password"){
                Parol.type = "text";
            }else{
                Parol.type = "password";
            }
        });

        let royxat = [];
        
        document.getElementById("qoshish-btn").addEventListener("click", function(){
            let yangiRoyxat = document.getElementById("inpt-Text").value;
            if (yangiRoyxat.trim() !== "") {
                royxat.push(yangiRoyxat);
                console.log(royxat);
                document.getElementById("inpt-Text").value = "";
            }
        });

        document.getElementById("inpt-Text").addEventListener("keydown", function(element){
            if(element.key == "Enter"){
                let yangiRoyxat = document.getElementById("inpt-Text").value;
                if (yangiRoyxat.trim() !== "") {
                    royxat.push(yangiRoyxat);
                    console.log(royxat);
                    document.getElementById("inpt-Text").value = "";
                }
            }
        });

        const formElement = document.querySelector(".container-1-3");

        formElement.addEventListener("submit", function(event){
            event.preventDefault();

            let Ism = document.getElementById("ism-inp").value;
            let Yosh = Number(document.getElementById("yosh-inp").value);

            if(Yosh >= 18){
                document.getElementById("natija").textContent = `${Ism}, Xush kelibsiz!`;
            }else{
                document.getElementById("natija").textContent = `${Ism}, Katta bo'lib qayting!`;
            }
        });

        let count = 0;
        const LikeImg = document.getElementById("like-img");
        const LikeBTN = document.getElementById("like-btn");
        const CountSpan = document.getElementById("like-count");
        LikeBTN.addEventListener("click", function(){
            let IsLike = LikeBTN.classList.toggle("liked");
            if(IsLike){
                count++;
                LikeImg.src = "like-icon-2.jpg";
            }else{
                count--;
                LikeImg.src = "like-icon1.png"
            }
            CountSpan.textContent = count;
        })
    </script>
</body>
</html>
